name: pong
on:
    repository_dispatch:
        types: [ping!]
jobs:
    output-payload:
        runs-on: ubuntu-latest
        steps:
            - name: ping
              run: echo ${{ github.event.client_payload.message}}
    pong:
        runs-on: ubuntu-latest
        steps:
            - name: pong
              run: |
                curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/Spudd1e/ping/dispatches \
                -d '{"event_type":"pong!","client_payload":{"message" : "pong!"}'
    

